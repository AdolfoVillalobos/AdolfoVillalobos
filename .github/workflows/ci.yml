name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, to catch external images or links that stop working
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments README.md
          fail: true

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: raven-actions/actionlint@v2
